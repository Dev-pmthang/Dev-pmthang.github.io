<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINH THANG Portfolio</title>
  <!-- Base portfolio layout and component styles -->
  <link rel="stylesheet" href="assets/css/style-orange-red.css?v=20260606-1" />
  <!-- Hero/avatar HUD overrides loaded after the base stylesheet -->
  <link rel="stylesheet" href="assets/css/style-orange-red-hud.css?v=20260606-16" />
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    /* Loading skeleton while profile data is being fetched */
    .profile-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      flex-direction: column;
      gap: 1rem;
    }
    .profile-loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--main-color, #ff6347);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .profile-loading .loading-text {
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .profile-error {
      display: none;
      text-align: center;
      padding: 2rem;
      color: #ff6b6b;
    }
    .profile-error .btn {
      margin-top: 1rem;
    }
  </style>
</head>

<body>
  <!-- Loading state shown while profile data is being fetched -->
  <div class="profile-loading" id="profile-loading">
    <div class="spinner"></div>
    <p class="loading-text">Loading profile...</p>
  </div>

  <!-- Error state shown when fetch fails -->
  <div class="profile-error" id="profile-error">
    <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;margin-bottom:0.5rem"></i>
    <p>Could not load profile data.</p>
    <button class="btn" onclick="location.reload()">Retry</button>
  </div>

  <!-- All content sections are rendered dynamically by script.js -->
  <header class="header" id="header-root"></header>

  <section class="home" id="home"></section>

  <section class="about" id="about"></section>

  <section class="services" id="services"></section>

  <section class="technical-stack" id="technical-stack"></section>

  <section class="projects" id="projects"></section>

  <section class="contact" id="contact"></section>

  <footer class="footer" id="footer-root"></footer>

  <script src="assets/data/project-galleries.js?v=20260605-2"></script>
  <script src="assets/js/script.js?v=20261125-1"></script>
</body>

</html>
